
workflows:
  firstesim-ios:
    name: FirstESIM iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: FirstESIM

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.firstesim.app
      vars:
        APP_ID: net.firstesim.app
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Prepare web assets and Capacitor configuration
        script: |
          set -e
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          find . -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.svg' \) -exec cp {} www/ \;

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "net.firstesim.app",
            "appName": "FirstESIM",
            "webDir": "www",
            "ios": { "contentInset": "automatic" }
          }
          EOF

          rm -rf ios
          npx cap add ios
          npx cap sync ios
          cd ios/App
          pod install --repo-update
          cd ../..

          test -f ios/App/App.xcworkspace/contents.xcworkspacedata
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/public/index.html

      - name: Configure iPhone-only device support
        script: |
          set -e
          cd ios/App

          ruby - <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('App.xcodeproj')
          app_target = project.targets.find { |target| target.product_type == 'com.apple.product-type.application' }

          abort 'App target not found' unless app_target

          app_target.build_configurations.each do |config|
            config.build_settings['TARGETED_DEVICE_FAMILY'] = '1'
            config.build_settings['SUPPORTS_MACCATALYST'] = 'NO'
          end

          project.save
          puts 'FirstESIM is configured for iPhone only.'
          RUBY

          cd ../..

      - name: Increment iOS build number
        script: |
          set -e
          cd ios/App
          agvtool new-version -all $(($(date +%s)))
          cd ../..

      - name: Configure iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build and sign iOS app
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
