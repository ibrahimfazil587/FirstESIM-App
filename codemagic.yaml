
workflows:
  firstesim-ios:
    name: FirstESIM iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: firstesim_app_store
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.firstesim.app
      vars:
        APP_ID: com.firstesim.app
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare Capacitor iOS project
        script: |
          npm run build
          npx cap add ios
          npx cap sync ios
      - name: Build iOS app
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/FirstESIM.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/FirstESIM.xcarchive/**
