
workflows:
  firstesim-ios:
    name: FirstESIM iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: FirstESIM

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.firstesim.app
      vars:
        APP_ID: net.firstesim.app
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Prepare Capacitor iOS project
        script: |
          npm run build
          npx cap add ios
          npx cap sync ios
          cd ios/App
          pod install --repo-update
          cd ../..
          echo "Checking iOS project location:"
          pwd
          find . -maxdepth 5 -name "App.xcodeproj"
          find . -maxdepth 5 -name "App.xcworkspace"

      - name: Increment iOS build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(date +%s)))
          cd ../..

      - name: Configure iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build and sign iOS app
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
