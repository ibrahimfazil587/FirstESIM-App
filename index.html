const box=document.getElementById("countries");
box.innerHTML=list.map(c=>`
<section class="country" id="c-${countries.indexOf(c)}">
<div class="country-head" style="background-image:url('${c.image||""}')">
<div class="country-head-inner">
<div><div class="country-name">${APP_LANG==="en"?c.en:APP_LANG==="ar"?countryArabic(c.en):c.name}</div></div>
<div class="flag">${c.flag||"🌍"}</div>
</div></div>
<div class="plans">
${c.plans.map((p,pi)=>{
 const un=String(p[0]).trim().toLowerCase()==="unlimited";
 return `<div class="plan ${un?"unlimited":""}">
 <div><div class="plan-data">${APP_LANG==="ar"&&un?"غير محدود":p[0]}</div><div class="plan-days">${APP_LANG==="en"?String(p[1]).replace(/ڕۆژ/g,"days"):APP_LANG==="ar"?String(p[1]).replace(/ڕۆژ/g,"يوم"):p[1]}</div></div>
 <div class="price">${p[2]}</div>
 <button class="buy" onclick="buy(${countries.indexOf(c)},${pi})">${APP_LANG==="en"?"View plans":APP_LANG==="ar"?"عرض الخطط":"بینینی پلانەکان"}</button>
 </div>`;
}).join("")}
</div></section
const I18N={
 ku:{heroTitle:"🌍 eSIM Turkey و پلانەکانی eSIM بۆ گەشت",heroSub:"خێراترین ئینتەرنێت گەشتیاری بۆ هەموو جیهان",featured:"وڵاتە پڕفرۆشەکان",all:"هەموو وڵاتەکان",allTab:"▦ هەموو"},
 ar:{heroTitle:"🌍 شرائح eSIM لتركيا وخطط eSIM للسفر",heroSub:"إنترنت سفر سريع لجميع أنحاء العالم",featured:"الدول الأكثر طلباً",all:"جميع الدول",allTab:"▦ الكل"},
 en:{heroTitle:"🌍 Turkey eSIM & Travel eSIM Plans",heroSub:"Fast travel internet plans for the whole world",featured:"Popular destinations",all:"All countries",allTab:"▦ All"}
};
let APP_LANG=localStorage.getItem("firstesim_lang")||"ku";
function countryArabic(en){
 try{
  const m={"USA":"US","UAE":"AE","Europe + UK":"GB","Global":""};
  if(en==="Global")return"العالم";
  if(m[en])return new Intl.DisplayNames(["ar"],{type:"region"}).of(m[en])||en;
  return en;
 }catch(e){return en}
}
function setLang(v){
 APP_LANG=["ku","ar","en"].includes(v)?v:"ku";
 localStorage.setItem("firstesim_lang",APP_LANG);
 document.documentElement.lang=APP_LANG;
 document.documentElement.dir=APP_LANG==="en"?"ltr":"rtl";
 document.getElementById("lang").value=APP_LANG;
 document.getElementById("heroTitle").textContent=I18N[APP_LANG].heroTitle;
 document.getElementById("heroSub").textContent=I18N[APP_LANG].heroSub;
 document.getElementById("featuredTitle").textContent=I18N[APP_LANG].featured;
 document.getElementById("allTitle").textContent=I18N[APP_LANG].all;
 document.getElementById("fAll").textContent=I18N[APP_LANG].allTab;
 renderFeatured();
 render(window.__currentList||countries);
}
function renderFeatured(){
 const names=["Turkey","Saudi Arabia","UAE","Europe + UK"];
 const list=names.map(n=>countries.find(c=>c.en===n)).filter(Boolean);
 document.getElementById("featured").innerHTML=list.map(c=>`
 <article class="feature-card">
 <div class="feature-img" style="background-image:url('${c.image||""}')"><div class="feature-flag">${c.flag||"🌍"}</div></div>
 <div class="feature-body"><div class="feature-name">${APP_LANG==="en"?c.en:APP_LANG==="ar"?countryArabic(c.en):c.name}</div>
 <div class="feature-price">${c.plans?.[0]?.[2]||""}</div>
 <button class="feature-btn" onclick="document.getElementById('c-${countries.indexOf(c)}')?.scrollIntoView({behavior:'smooth'})">${APP_LANG==="en"?"View plans":APP_LANG==="ar"?"عرض الخطط":"بینینی پلانەکان"}</button>
 </div></article>`).join("");
}
renderFeatured();
setLang(APP_LANG);
>`).join("");
document.getElementById("empty").style.display=list.length?"none":"block";
document.getElementById("count").textContent=list.length+" "+(APP_LANG==="en"?"countries":APP_LANG==="ar"?"دولة":"وڵات");
}

async function buy(ci, pi){

  const c = countries[ci];
  const p = c.plans[pi];

  const customerName = prompt("ناوی کڕیار بنووسە:");
  if(!customerName) return;

  const customerPhone = prompt("ژمارەی مۆبایل بنووسە:");
  if(!customerPhone) return;

  const payment = prompt(
    "شێوازی پارەدان بنووسە:\nFIB / FastPay / Super Qi / QuickPay"
  );

  if(!payment) return;

  const orderData = new FormData();

  orderData.append("customerName", customerName);
  orderData.append("customerPhone", customerPhone);

  orderData.append("country", c.name);
  orderData.append("plan", p[0]);
  orderData.append("price", p[2]);

  orderData.append("payment", payment);

  try{

    const response = await fetch(
      "https://firstesim-api.onrender.com/api/orders",
      {
        method:"POST",
        body:orderData
      }
    );

    const data = await response.json();

    if(!response.ok){
      alert(
        data.error || "هەڵەیەک ڕوویدا."
      );
      return;
    }

    const order = data.order;

    const message = `سڵاو 👋

داواکاری eSIM ـم کرد:

🌍 وڵات: ${c.name}
📦 پلان: ${p[0]}
📅 ماوە: ${p[1]}
💰 نرخ: ${p[2]}

👤 ناو: ${customerName}
📱 ژمارە: ${customerPhone}
💳 پارەدان: ${payment}

🆔 Order ID: ${order.id}

تکایە داواکارییەکەم پشکنین بکەن.`;

    window.location.href =
      "https://wa.me/" +
      WHATSAPP +
      "?text=" +
      encodeURIComponent(message);

  }catch(error){

    console.error(error);

    alert(
      "پەیوەندی بە سیستەمی Order نەکرا. تکایە دووبارە هەوڵ بدەرەوە."
    );
  }
}

function filterRegion(region,btn){

document
.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

document.getElementById("search").value="";

render(
region==="all"
?countries
:countries.filter(c=>c.region===region)
);

}

function searchPlans(){

const input=document.getElementById("search");
const value=String(input?.value||"").trim();

if(!value){
render(countries);
return;
}

const normalize=s=>String(s||"")
.toLowerCase()
.normalize("NFKC")
.replace(/[يى]/g,"ی")
.replace(/[كک]/g,"ک")
.replace(/[ةۀ]/g,"ە")
.replace(/[ؤ]/g,"ۆ")
.replace(/[إأآ]/g,"ا")
.replace(/[ئ]/g,"ی")
.replace(/[ـ]/g,"")
.replace(/[.,،؛;:!?؟()[\]{}_-]+/g," ")
.replace(/\s+/g," ")
.trim();

const q=normalize(value);
const qc=q.replace(/\s/g,"");

const result=countries.filter(c=>{

const planText=(Array.isArray(c.plans)?c.plans:[])
.map(p=>Array.isArray(p)?p.join(" "):String(p||""))
.join(" ");

const text=normalize([
c.name,
c.en,
c.place,
c.region,
c.flag,
c.scene,
planText
].join(" "));

const compact=text.replace(/\s/g,"");

return text.includes(q)||compact.includes(qc);

});

render(result);

}

render();
