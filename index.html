function render(list=countries){

const box=document.getElementById("countries");

box.innerHTML=list.map((c)=>`

<section class="country">

<div class="country-head" style="background-image:url('${c.image||""}')">

<div class="country-title">

<div class="country-left">

<div class="country-flag">${c.flag}</div>

<div>
<div class="country-name">${c.en}</div>
</div>

</div>

<div class="country-badges">
<div class="country-badge">📶 eSIM</div>
<div class="country-badge">📍 ${c.place}</div>
</div>

</div>
</div>

<div class="plans">

${c.plans.map((p,pi)=>{

const isUnlimited=
String(p[0]).trim().toLowerCase()==="unlimited";

return `

<div class="plan ${isUnlimited?"unlimited":""}">

<div class="plan-info">
<div class="plan-data">${p[0]}</div>
<div class="plan-days">${p[1]}</div>
</div>

<div class="plan-price">${p[2]}</div>

<button class="buy" onclick="buy(${countries.indexOf(c)},${pi})">
کڕین 🛒
</button>

</div>

`;

}).join("")}

</div>

</section>

`).join("");

document.getElementById("empty").style.display=
list.length?"none":"block";

}

let fesimCurrentOrder=null;
let fesimSelectedPayment="";
let fesimPollTimer=null;

function openFesimOrder(ci,pi){
  const c=countries[ci], p=c.plans[pi];
  fesimCurrentOrder={c,p};
  fesimSelectedPayment="";
  document.querySelectorAll('.fesim-pay').forEach(b=>b.classList.remove('selected'));
  document.getElementById('fesimReceipt').value="";
  document.getElementById('fesimContinue').disabled=true;
  document.getElementById('fesimSummary').innerHTML=`<b>🌍 وڵات:</b> ${c.name}<br><b>📦 پلان:</b> ${p[0]}<br><b>📅 ماوە:</b> ${p[1]}<br><b>💰 نرخ:</b> ${p[2]}`;
  document.getElementById('fesimStatus').textContent="";
  document.getElementById('fesimQr').style.display='none';
  document.getElementById('fesimActivation').textContent="";
  document.getElementById('fesimPaymentArea').style.display='block';
  document.getElementById('fesimOrderModal').classList.add('show');
}

function closeFesimOrder(){
  if(fesimPollTimer) clearInterval(fesimPollTimer);
  document.getElementById('fesimOrderModal').classList.remove('show');
}

function updateFesimContinue(){
  document.getElementById('fesimContinue').disabled=!(fesimSelectedPayment && document.getElementById('fesimReceipt').files[0]);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('.fesim-pay');
  if(b){
    fesimSelectedPayment=b.dataset.payment;
    document.querySelectorAll('.fesim-pay').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    updateFesimContinue();
  }
});
document.addEventListener('change',e=>{ if(e.target.id==='fesimReceipt') updateFesimContinue(); });
document.getElementById('fesimContinue').addEventListener('click',submitFesimOrder);

async function buy(ci,pi){ openFesimOrder(ci,pi); }

async function submitFesimOrder(){
  const c=fesimCurrentOrder.c, p=fesimCurrentOrder.p;
  const receipt=document.getElementById('fesimReceipt').files[0];
  if(!fesimSelectedPayment || !receipt){ alert('تکایە شێوازی پارەدان و پسوڵە هەڵبژێرە.'); return; }
  const btn=document.getElementById('fesimContinue');
  btn.disabled=true;
  document.getElementById('fesimStatus').textContent='داواکاری دروست دەکرێت...';
  const fd=new FormData();
  fd.append('country',c.name);
  fd.append('plan',p[0]);
  fd.append('price',p[2]);
  fd.append('payment',fesimSelectedPayment);
  fd.append('receipt',receipt);
  try{
    const response=await fetch('https://firstesim-api.onrender.com/api/orders',{method:'POST',body:fd});
    const data=await response.json().catch(()=>({}));
    if(!response.ok){ throw new Error(data.error||'هەڵەیەک ڕوویدا.'); }
    const order=data.order||data;
    fesimCurrentOrder.order=order;
    localStorage.setItem('firstesim_order',JSON.stringify({id:order.id,country:c.name,plan:p[0],price:p[2]}));
    const message=`سڵاو 👋\n\nداواکاری eSIM ـم کرد:\n\n🌍 وڵات: ${c.name}\n📦 پلان: ${p[0]}\n📅 ماوە: ${p[1]}\n💰 نرخ: ${p[2]}\n💳 پارەدان: ${fesimSelectedPayment}\n🆔 Order ID: ${order.id}\n\nپسوڵە لە ناو سیستەمەکە upload کراوە.`;
    window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(message),'_blank');
    document.getElementById('fesimPaymentArea').style.display='none';
    document.getElementById('fesimStatus').textContent='داواکارییەکەت وەرگیرا. 5 خولەک چاوەڕوان بە تا QR لەلایەن Admin ـەوە دابنرێت.';
    startFesimPolling(order.id);
  }catch(err){
    console.error(err);
    btn.disabled=false;
    document.getElementById('fesimStatus').textContent=err.message||'پەیوەندی بە سیستەمی Order نەکرا.';
  }
}

function startFesimPolling(orderId){
  if(fesimPollTimer) clearInterval(fesimPollTimer);
  let elapsed=0;
  const check=async()=>{
    try{
      const r=await fetch('https://firstesim-api.onrender.com/api/orders/'+encodeURIComponent(orderId),{cache:'no-store'});
      if(!r.ok) return;
      const d=await r.json();
      const o=d.order||d;
      if(o.status==='esim_ready' && o.qrUrl){
        clearInterval(fesimPollTimer);
        document.getElementById('fesimStatus').textContent='QR ـەکەت ئامادەیە ✅';
        const qr=document.getElementById('fesimQr'); qr.src=o.qrUrl; qr.style.display='block';
        document.getElementById('fesimActivation').textContent=o.activationCode||'';
      }
    }catch(e){}
    elapsed+=15000;
    if(elapsed>=300000 && !document.getElementById('fesimQr').src){
      clearInterval(fesimPollTimer);
      document.getElementById('fesimStatus').textContent='هێشتا QR ئامادە نەکراوە. تکایە لە هەمان پەڕە چاوەڕێ بکە تا Admin دابنێت.';
    }
  };
  check();
  fesimPollTimer=setInterval(check,15000);
}

function filterRegion(region,btn){

document
.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

document.getElementById("search").value="";

render(
region==="all"
?countries
:countries.filter(c=>c.region===region)
);

}

function searchPlans(){

const input=document.getElementById("search");
const value=String(input?.value||"").trim();

if(!value){
render(countries);
return;
}

const normalize=s=>String(s||"")
.toLowerCase()
.normalize("NFKC")
.replace(/[يى]/g,"ی")
.replace(/[كک]/g,"ک")
.replace(/[ةۀ]/g,"ە")
.replace(/[ؤ]/g,"ۆ")
.replace(/[إأآ]/g,"ا")
.replace(/[ئ]/g,"ی")
.replace(/[ـ]/g,"")
.replace(/[.,،؛;:!?؟()[\]{}_-]+/g," ")
.replace(/\s+/g," ")
.trim();

const q=normalize(value);
const qc=q.replace(/\s/g,"");

const result=countries.filter(c=>{

const planText=(Array.isArray(c.plans)?c.plans:[])
.map(p=>Array.isArray(p)?p.join(" "):String(p||""))
.join(" ");

const text=normalize([
c.name,
c.en,
c.place,
c.region,
c.flag,
c.scene,
planText
].join(" "));

const compact=text.replace(/\s/g,"");

return text.includes(q)||compact.includes(qc);

});

render(result);

}

render();
