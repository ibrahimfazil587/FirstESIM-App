<title>FirstESIM App</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Noto Sans Arabic",sans-serif}
button,input{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}
header{position:sticky;top:0;z-index:20;background:#fff;padding:14px 16px;border-bottom:1px solid #e8edf5;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;font-weight:900;color:#0862bd}.logo span{color:#e53935}.lang{border:0;background:#eef5ff;color:#0862bd;border-radius:14px;padding:8px 11px;font-weight:800}
.hero{margin:16px;border-radius:26px;padding:25px 20px;color:white;background:linear-gradient(135deg,#064b9c,#1688e8);box-shadow:0 10px 30px #0862bd22}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;line-height:1.7}
.search{width:calc(100% - 32px);margin:0 16px 14px;padding:14px 16px;border:1px solid #e2e8f0;border-radius:16px;background:#fff;outline:none}
.filters{display:flex;gap:8px;overflow:auto;padding:0 16px 12px}.filter{white-space:nowrap;border:0;border-radius:13px;padding:9px 13px;background:#fff;color:#526071}.filter.active{background:#0862bd;color:#fff}
.section{padding:0 16px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid #e8edf5;border-radius:18px;padding:15px;box-shadow:0 4px 18px #1020400a}.country{cursor:pointer;min-height:120px}.flag{font-size:34px}.small{font-size:13px;color:#718096}.price{font-weight:900;color:#0862bd}
.plan{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 16px;padding:15px;background:#fff;border:1px solid #e7edf5;border-radius:18px}.plan-data{font-weight:900;font-size:17px}
.buy,.primary{border:0;background:#0862bd;color:#fff;border-radius:13px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{width:100%;margin-top:14px;padding:14px}.back{border:0;background:transparent;color:#0862bd;font-weight:900;padding:15px 16px 4px;cursor:pointer}
.pay{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #edf1f6;border-radius:16px;padding:13px;margin:9px 0;cursor:pointer}.pay.active{border-color:#0862bd;background:#f3f8ff}.pay-icon{width:40px;height:40px;border-radius:12px;background:#eef5ff;display:grid;place-items:center;font-weight:900}
.upload{background:#fff;border:2px dashed #b9c8da;border-radius:18px;padding:16px;margin-top:12px}.status{margin-top:14px;padding:15px;border-radius:17px;background:#fff8df;border:1px solid #f2d98a}.ready{background:#e9fff1;border-color:#a8dfbd}
.timer{font-size:32px;font-weight:900;text-align:center;color:#0862bd;margin:10px 0}.qr{display:block;width:min(100%,360px);margin:14px auto;border-radius:16px;border:8px solid #fff;box-shadow:0 4px 20px #0002}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#fff;border-top:1px solid #e5eaf1;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}
.bottom button{border:0;background:transparent;padding:8px;color:#64748b;font-weight:800}.bottom button.active{color:#0862bd}.note{line-height:1.8;color:#526071;background:#f7f9fc;border-radius:15px;padding:13px;margin-top:12px}.empty{text-align:center;padding:35px;color:#64748b}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

let selectedCountry=null,selectedPlan=null,selectedPay="",order=null,timerHandle=null,pollHandle=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setNav(id){document.querySelectorAll(".bottom button").forEach(b=>b.classList.remove("active"));document.getElementById(id)?.classList.add("active")}
function app(html){document.getElementById("app").innerHTML=html}
function showHome(){setNav("navHome");app(`<header><div class="logo">First<span>ESIM</span></div><button class="lang" onclick="alert('Kurdî → English → العربية')">KUR ▾</button></header><section class="hero"><h1>گەشتی بێ سنوور 🌍</h1><p>eSIM ـی خێرا و ئاسان بۆ هەموو جیهان</p></section><input class="search" placeholder="گەڕان بە ناوی وڵات..." oninput="renderCountries(this.value)"><div class="filters"><button class="filter active" onclick="filterRegion('all',this)">هەموو</button><button class="filter" onclick="filterRegion('europe',this)">🇪🇺 ئەوروپا</button><button class="filter" onclick="filterRegion('asia',this)">🌏 ئاسیا</button><button class="filter" onclick="filterRegion('middle',this)">🌙 ناوەڕاست</button><button class="filter" onclick="filterRegion('america',this)">🌎 ئەمەریکا</button><button class="filter" onclick="filterRegion('global',this)">🌍 جیهان</button></div><section class="section"><div class="section-title"><h3>وڵاتەکان</h3><span class="small">${countries.length} وڵات</span></div><div id="countryGrid" class="grid"></div></section>`);renderCountries("")}
function countryCard(c,i){return `<div class="card country" onclick="showCountry(${i})"><div class="flag">${esc(c.flag||"🌍")}</div><b>${esc(c.name)}</b><div class="small">${esc(c.en||"")}</div><div class="price">لە ${esc(c.plans?.[0]?.[2]||"—")}</div></div>`}
function renderCountries(q="",region="all"){const v=String(q).trim().toLowerCase();const list=countries.map((c,i)=>[c,i]).filter(([c])=>(region==="all"||c.region===region)&&(!v||`${c.name} ${c.en} ${c.place}`.toLowerCase().includes(v)));const el=document.getElementById("countryGrid");if(el)el.innerHTML=list.map(([c,i])=>countryCard(c,i)).join("")||`<div class="empty">هیچ وڵاتێک نەدۆزرایەوە.</div>`}
function filterRegion(region,btn){document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");renderCountries(document.querySelector(".search")?.value||"",region)}
function showCountries(){setNav("navCountries");app(`<header><div class="logo">First<span>ESIM</span></div></header><input class="search" id="countrySearch" placeholder="گەڕان..." oninput="renderCountries(this.value)"><section class="section"><div id="countryGrid" class="grid"></div></section>`);renderCountries("")}
function showCountry(i){selectedCountry=countries[i];app(`<button class="back" onclick="showCountries()">← گەڕانەوە</button><section class="section"><div class="card"><div class="flag">${esc(selectedCountry.flag||"🌍")}</div><h2>${esc(selectedCountry.name)}</h2><div class="small">${esc(selectedCountry.en||"")}</div></div></section>${selectedCountry.plans.map((p,j)=>`<div class="plan"><div><div class="plan-data">${esc(p[0])}</div><div class="small">${esc(p[1])}</div></div><div><div class="price">${esc(p[2])}</div><button class="buy" onclick="checkout(${j})">کڕین</button></div></div>`).join("")}`)}
function checkout(j){selectedPlan=selectedCountry.plans[j];selectedPay="";app(`<button class="back" onclick="showCountry(${countries.indexOf(selectedCountry)})">← گەڕانەوە</button><section class="section"><h2>کڕینی eSIM</h2><div class="card"><b>${esc(selectedCountry.flag)} ${esc(selectedCountry.name)}</b><p>${esc(selectedPlan[0])} — ${esc(selectedPlan[1])}</p><h2>${esc(selectedPlan[2])}</h2></div><h3>شێوازی پارەدان</h3>${pay("🏦","FIB","7506021212")}${pay("⚡","FastPay","7506021212")}${pay("Q","Super Qi","7111649351")}${pay("↗","QuickPay","7508107121")}<button class="primary" onclick="paymentStep()">بەردەوام بە</button></section>`)}
function pay(icon,name,number){return `<div class="pay ${selectedPay===name?"active":""}" onclick="selectPayment('${name}')"><div class="pay-icon">${icon}</div><div><b>${name}</b><div class="small">${number}</div></div></div>`}
function selectPayment(name){selectedPay=name;checkout(selectedCountry.plans.indexOf(selectedPlan))}
function paymentStep(){if(!selectedPay){alert("تکایە شێوازی پارەدان هەڵبژێرە");return}app(`<button class="back" onclick="checkout(${selectedCountry.plans.indexOf(selectedPlan)})">← گەڕانەوە</button><section class="section"><h2>پارەدان بە ${esc(selectedPay)}</h2><div class="card"><b>${esc(selectedCountry.name)}</b><p>${esc(selectedPlan[0])} — ${esc(selectedPlan[1])}</p><h2>${esc(selectedPlan[2])}</h2><div class="note">دوای پارەدان، تکایە پسوڵەکە لێرە upload بکە. هیچ ناو یان ژمارەی کڕیار پێویست نییە.</div></div><div class="upload"><b>📎 پسوڵەی پارەدان</b><p class="small">تکایە وێنەی پسوڵەکە upload بکە.</p><input id="receipt" type="file" accept="image/*,.pdf"></div><button class="primary" id="orderBtn" onclick="createOrder()">تۆمارکردنی Order</button></section>`)}
async function createOrder(){const receipt=document.getElementById("receipt")?.files?.[0];if(!receipt){alert("تکایە پسوڵەی پارەدان upload بکە");return}const btn=document.getElementById("orderBtn");btn.disabled=true;btn.textContent="لە ناردندا...";const data=new FormData();data.append("customerName","");data.append("customerPhone","");data.append("country",selectedCountry.name);data.append("plan",`${selectedPlan[0]} — ${selectedPlan[1]}`);data.append("price",selectedPlan[2]);data.append("payment",selectedPay);data.append("receipt",receipt);try{const r=await fetch(`${API_BASE}/api/orders`,{method:"POST",body:data});const d=await r.json();if(!r.ok)throw Error(d.error||"Order failed");order=d.order;localStorage.setItem("firstesim_order",JSON.stringify(order));const msg=`سڵاو FirstESIM 👋\n\n🆕 Order نوێ\n🆔 ${order.id}\n🌍 ${selectedCountry.name}\n📦 ${selectedPlan[0]} — ${selectedPlan[1]}\n💰 ${selectedPlan[2]}\n💳 ${selectedPay}\n\nپسوڵە لە سیستەمەکەدا upload کراوە.\nتکایە پشکنینی بکەن و QR ـەکە دابین بکەن.`;localStorage.setItem("firstesim_wait_until",String(Date.now()+300000));
const waUrl=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
try{window.open(waUrl,"_blank")}catch(e){}
showOrder(true)}catch(e){alert("Order نەکرا. تکایە دووبارە هەوڵ بدە.");btn.disabled=false;btn.textContent="تۆمارکردنی Order"}}
function statusText(s){return ({waiting_payment_check:"چاوەڕوانی پشکنینی پارەدان",payment_confirmed:"پارەدان پشتڕاست کرا",esim_ready:"eSIM ئامادەیە",completed:"تەواو کرا",cancelled:"هەڵوەشێنرایەوە"})[s]||s||"نادیار"}
function qrUrl(o){return o.qrUrl?(o.qrUrl.startsWith("http")?o.qrUrl:`${API_BASE}${o.qrUrl}`):""}
function startTracking(){clearInterval(pollHandle);pollHandle=setInterval(refreshOrder,10000);let saved=Number(localStorage.getItem("firstesim_wait_until")||0);let left=saved>Date.now()?Math.ceil((saved-Date.now())/1000):300;if(!saved)localStorage.setItem("firstesim_wait_until",String(Date.now()+left*1000));startTimer(left)}
function startTimer(sec){clearInterval(timerHandle);let end=Date.now()+sec*1000;const tick=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));const el=document.getElementById("timer");if(el)el.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;if(left<=0)clearInterval(timerHandle)};tick();timerHandle=setInterval(tick,1000)}
async function refreshOrder(){if(!order?.id)return;try{const r=await fetch(`${API_BASE}/api/orders/${encodeURIComponent(order.id)}`);const d=await r.json();if(r.ok){order=d.order;localStorage.setItem("firstesim_order",JSON.stringify(order));showOrder(false)}}catch(e){}}
function showOrder(start=true){if(!order)order=JSON.parse(localStorage.getItem("firstesim_order")||"null");if(!order){showOrders();return}setNav("navOrders");const ready=order.status==="esim_ready"&&order.qrUrl;app(`<button class="back" onclick="showOrders()">← سفارشەکان</button><section class="section"><h2>سفارشەکەت</h2><div class="card"><b>${esc(order.id)}</b><p>${esc(order.country)} — ${esc(order.plan)}</p><h3>${esc(order.price)}</h3><p>پارەدان: ${esc(order.payment)}</p></div>${ready?`<div class="card ready"><h2>✅ eSIM ئامادەیە</h2><p>QR ـەکەت ئێستا ئامادەیە.</p><img class="qr" src="${qrUrl(order)}" alt="eSIM QR"><div class="note"><b>Activation Code</b><br>${esc(order.activationCode||"—")}</div></div>`:`<div class="status"><b>⏳ داواکارییەکەت وەرگیراوە</b><div id="timer" class="timer">05:00</div><div>تکایە چاوەڕێ بکە. تیمی FirstESIM پارەکە پشکنین دەکات و QR ـی ڕاستەقینە دەنێرێت.</div></div>`}<button class="primary" onclick="refreshOrder()">🔄 نوێکردنەوە</button></section>`);if(start&&!ready)startTracking()}
function showOrders(){setNav("navOrders");order=JSON.parse(localStorage.getItem("firstesim_order")||"null");app(`<header><div class="logo">First<span>ESIM</span></div></header><section class="section"><h2>سفارشەکانم</h2>${order?`<div class="card" onclick="showOrder()"><b>${esc(order.id)}</b><p>${esc(order.country)} — ${esc(order.plan)}</p><div class="small">${esc(statusText(order.status))}</div></div>`:`<div class="empty">هێشتا هیچ Order ـێکت نییە.</div>`}</section>`)}
showHome();
</script>
