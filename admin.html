<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0862bd">
<title>FirstESIM — Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:1000px;margin:auto;padding:16px}h1{color:#0862bd;font-size:24px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0000000a}input,button,select{font:inherit}.input,input[type=text],select{width:100%;padding:13px;border:1px solid #d9e1ec;border-radius:12px;background:#fff}.btn{border:0;background:#0862bd;color:#fff;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.green{background:#159447}.danger{background:#c62828}.gray{background:#edf2f7;color:#172033}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#64748b}.status{padding:6px 10px;border-radius:10px;background:#fff4cf;display:inline-block;font-size:12px}.ready{background:#dff8e8}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.order{border-top:1px solid #e8edf4;padding-top:14px;margin-top:14px}.hidden{display:none}.notice{padding:12px;border-radius:12px;margin-top:10px;font-weight:700;font-size:14px}.ok{background:#e5f8eb;color:#126b35}.err{background:#fff0f0;color:#a91f1f}.warn{background:#fff4d8;color:#805600}a{color:#0862bd;font-weight:800;overflow-wrap:anywhere}.qr-preview{max-width:180px;max-height:180px;display:block;margin:8px 0;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button,.actions label{flex:1;min-width:120px;text-align:center}.small{font-size:12px;color:#64748b}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h1>FirstESIM — Admin Panel</h1>
    <p class="muted">ئەم بەشە تەنها بۆ Admin ـە.</p>
    <label for="key"><b>ADMIN_KEY</b></label>
    <input id="key" class="input" type="password" placeholder="ADMIN_KEY" autocomplete="current-password">
    <div class="row" style="margin-top:10px"><button class="btn" id="loginBtn">چوونەژوورەوە</button></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="top"><h1>FirstESIM — Orders</h1><span id="count" class="status">0</span></div>
      <div class="row">
        <button class="btn" id="refreshBtn">🔄 نوێکردنەوە</button>
        <button class="btn green" id="notifyBtn">🔔 Enable Notifications</button>
      </div>
      <div id="message" aria-live="polite"></div>
      <p class="small">بۆ Push Notification لە iPhone، وێبسایتەکە لە Safari بکەرەوە، ئەگەر پێویست بوو زیادیکە بۆ Home Screen، پاشان ڕێگە بە Notifications بدە.</p>
    </div>
    <div id="orders"></div>
  </div>
</div>
<script>
'use strict';
const API='https://firstesim-backend-staging.onrender.com';
const keyInput=document.getElementById('key');
let key=sessionStorage.getItem('firstesim_admin_key')||'';
keyInput.value=key;
const $=id=>document.getElementById(id);
function setMessage(text,type='ok'){ $('message').innerHTML=`<div class="notice ${type}">${esc(text)}</div>`; }
function headers(){return {'x-admin-key':key};}
function statusText(s){return ({waiting_payment_check:'چاوەڕوانی پشکنینی پارەدان',payment_confirmed:'پارەدان پشتڕاست کرا',esim_ready:'eSIM ئامادەیە',completed:'تەواو کرا',cancelled:'هەڵوەشێنرایەوە'})[s]||s||'نادیار';}
function fileUrl(u){return u?(u.startsWith('http')?u:API+u):'';}
async function openProtectedFile(url){try{const r=await fetch(fileUrl(url),{headers:headers()});if(!r.ok)throw new Error('HTTP '+r.status);const blob=await r.blob();const objectUrl=URL.createObjectURL(blob);window.open(objectUrl,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(objectUrl),60000);}catch(e){setMessage('نەتوانرا فایل بکرێتەوە: '+e.message,'err');}}
async function loadProtectedImage(url,imgId){try{const r=await fetch(fileUrl(url),{headers:headers()});if(!r.ok)throw new Error('HTTP '+r.status);const blob=await r.blob();const obj=URL.createObjectURL(blob);const img=$(imgId);if(img){if(img.dataset.objectUrl)URL.revokeObjectURL(img.dataset.objectUrl);img.src=obj;img.dataset.objectUrl=obj;}}catch(e){console.warn('Protected image unavailable',e);}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function login(){key=keyInput.value.trim();if(!key){setMessage('تکایە ADMIN_KEY بنووسە.','err');return;}sessionStorage.setItem('firstesim_admin_key',key);await loadOrders();}
async function loadOrders(silent=false){
 if(!key){$('login').classList.remove('hidden');$('panel').classList.add('hidden');return;}
 try{const r=await fetch(`${API}/api/admin/orders`,{headers:headers()});const d=await r.json();if(!r.ok)throw new Error(d.error||'هەڵە لە چوونەژوورەوە');
 $('login').classList.add('hidden');$('panel').classList.remove('hidden');render(d.orders||[]);if(!silent)setMessage('Orders بە سەرکەوتوویی بارکران.','ok');
 }catch(e){setMessage('کێشە: '+e.message,'err');if(!silent){$('login').classList.remove('hidden');$('panel').classList.add('hidden');}}
}
function render(orders){$('count').textContent=orders.length;const box=$('orders');if(!orders.length){box.innerHTML='<div class="card">هیچ Order ـێک نییە.</div>';return;}
 box.innerHTML=orders.map(o=>{const id=esc(o.id);const receipt=fileUrl(o.receiptUrl);const qr=fileUrl(o.qrUrl);return `<div class="card order"><div class="top"><h2>${id}</h2><span class="status ${o.status==='esim_ready'?'ready':''}">${esc(statusText(o.status))}</span></div>
 <p><b>🌍 وڵات:</b> ${esc(o.country)}</p><p><b>📦 پلان:</b> ${esc(o.plan)}</p><p><b>💰 نرخ:</b> ${esc(o.price)}</p><p><b>💳 پارەدان:</b> ${esc(o.payment)}</p><p><b>📅 کات:</b> ${esc(o.createdAt?new Date(o.createdAt).toLocaleString():'—')}</p>
 ${receipt?`<p>🧾 <button type="button" class="btn" onclick="openProtectedFile('${esc(o.receiptUrl)}')">کردنەوەی پسوڵە</button></p>`:''}
 ${qr?`<p><b>QR:</b><button type="button" class="btn" onclick="openProtectedFile('${esc(o.qrUrl)}')">کردنەوەی QR</button></p>`:''}
 <label for="status-${id}"><b>گۆڕینی دۆخ</b></label><select id="status-${id}"><option value="waiting_payment_check" ${o.status==='waiting_payment_check'?'selected':''}>چاوەڕوانی پارە</option><option value="payment_confirmed" ${o.status==='payment_confirmed'?'selected':''}>پارە پشتڕاستە</option><option value="completed" ${o.status==='completed'?'selected':''}>تەواو</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>هەڵوەشاندنەوە</option></select>
 <div class="row" style="margin-top:9px"><button class="btn green" onclick="setStatus('${id}','payment_confirmed')">پارە پشتڕاست بکە</button><button class="btn" onclick="saveSelectedStatus('${id}')">پاشەکەوتی دۆخ</button></div>
 <div style="margin-top:12px"><label for="qr-${id}"><b>📱 Upload QR</b></label><input id="qr-${id}" type="file" accept="image/*,.png,.jpg,.jpeg"><label for="code-${id}"><b>Activation Code</b></label><input id="code-${id}" type="text" value="${esc(o.activationCode||'')}" placeholder="Activation Code"><button class="btn" style="margin-top:8px;width:100%" onclick="uploadQR('${id}')">Upload QR و ئاگادارکردنەوە</button></div>
 </div>`;}).join('');}
async function setStatus(id,status){try{const r=await fetch(`${API}/api/admin/orders/${encodeURIComponent(id)}/status`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Status failed');setMessage(`${id}: ${statusText(status)}`,'ok');await loadOrders(true);}catch(e){setMessage('کێشە: '+e.message,'err');}}
async function saveSelectedStatus(id){const status=$(`status-${id}`)?.value;if(status)await setStatus(id,status);}
async function uploadQR(id){const file=$(`qr-${id}`)?.files?.[0];const code=$(`code-${id}`)?.value||'';if(!file&&!code){setMessage('تکایە QR یان Activation Code زیاد بکە.','err');return;}const fd=new FormData();if(file)fd.append('qr',file);if(code)fd.append('activationCode',code);try{const r=await fetch(`${API}/api/admin/orders/${encodeURIComponent(id)}/qr`,{method:'POST',headers:headers(),body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'QR upload failed');setMessage('QR/Activation Code پاشەکەوت کرا. Notification بۆ کڕیار تەنها ئەگەر Subscription ـی هەبێت دەنێردرێت.','ok');await loadOrders(true);}catch(e){setMessage('کێشە: '+e.message,'err');}}
function urlBase64ToUint8Array(s){const padding='='.repeat((4-s.length%4)%4);const raw=atob((s+padding).replace(/-/g,'+').replace(/_/g,'/'));const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;}
async function enableNotifications(){try{
 if(!window.isSecureContext)throw new Error('Push پێویستی بە HTTPS هەیە.');
 if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw new Error('ئەم browser ـە Push Notification پشتگیری ناکات.');
 if(!key){key=keyInput.value.trim();if(!key)throw new Error('سەرەتا ADMIN_KEY بنووسە.');sessionStorage.setItem('firstesim_admin_key',key);}
 const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('مۆڵەتی Notification ڕێگەپێنەدرا.');
 const reg=await navigator.serviceWorker.register(new URL('sw-admin.js', document.baseURI),{scope:new URL('.', document.baseURI).pathname});await navigator.serviceWorker.ready;
 const kr=await fetch(`${API}/api/admin/push/public-key`,{headers:headers()});const kd=await kr.json();if(!kr.ok||!kd.publicKey)throw new Error(kd.error||'نەتوانرا VAPID public key وەربگیرێت.');
 let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(kd.publicKey)});
 const sr=await fetch(`${API}/api/admin/push/subscribe`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON()})});const sd=await sr.json();if(!sr.ok)throw new Error(sd.error||'Subscription پاشەکەوت نەکرا.');
 setMessage('Push Subscription پاشەکەوت کرا. ئێستا Order ـێکی نوێ تاقی بکەرەوە.','ok');
 }catch(e){console.error('Enable notification failed:',e);setMessage('کێشەی Notification: '+e.message,'err');}}
$('loginBtn').addEventListener('click',login);$('refreshBtn').addEventListener('click',()=>loadOrders());$('notifyBtn').addEventListener('click',enableNotifications);
if(key)loadOrders();
</script>
</body>
</html>
