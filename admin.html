<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FirstESIM Admin Panel</title>
<style>
body{margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#172033}
.wrap{max-width:1000px;margin:auto;padding:20px}
h1{color:#0862bd}
.card{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0000000a}
input,button{font:inherit}
.input{width:100%;padding:13px;border:1px solid #d9e1ec;border-radius:12px;box-sizing:border-box}
.btn{border:0;background:#0862bd;color:#fff;border-radius:12px;padding:11px 15px;font-weight:800}
.green{background:#159447}
.danger{background:#c62828}
.row{display:flex;gap:10px;flex-wrap:wrap}
.muted{color:#64748b}
.status{padding:6px 10px;border-radius:10px;background:#fff4cf;display:inline-block}
.ready{background:#dff8e8}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.order{border-top:1px solid #e8edf4;padding-top:14px;margin-top:14px}
.hidden{display:none}
</style>
</head>

<body>
<div class="wrap">

<div id="login" class="card">
<h1>FirstESIM — Admin Panel</h1>
<p class="muted">ئەم بەشە تەنها بۆ Admin ـە.</p>

<input id="key" class="input" type="password" placeholder="ADMIN_KEY">

<br><br>

<button class="btn" onclick="login()">
چوونەژوورەوە
</button>
</div>

<div id="panel" class="hidden">

<div class="top">
<h1>Orders</h1>
<button class="btn" onclick="loadOrders()">🔄 نوێکردنەوە</button>
</div>

<div id="orders"></div>

</div>
</div>

<script>

const API="https://firstesim-api.onrender.com";

let key=sessionStorage.getItem("firstesim_admin_key")||"";

function login(){
key=document.getElementById("key").value.trim();

if(!key)return;

sessionStorage.setItem("firstesim_admin_key",key);

loadOrders();
}

function headers(){
return {"x-admin-key":key};
}

function statusText(s){
return ({
waiting_payment_check:"چاوەڕوانی پشکنینی پارەدان",
payment_confirmed:"پارەدان پشتڕاست کرا",
esim_ready:"eSIM ئامادەیە",
completed:"تەواو کرا",
cancelled:"هەڵوەشێنرایەوە"
})[s]||s;
}

function fileUrl(u){
return u ? (u.startsWith("http") ? u : `${API}${u}`) : "";
}

async function loadOrders(){

try{

const r=await fetch(`${API}/api/admin/orders`,{
headers:headers()
});

const d=await r.json();

if(!r.ok)throw Error();

document.getElementById("login").classList.add("hidden");

document.getElementById("panel").classList.remove("hidden");

render(d.orders||[]);

}catch(e){

alert("ADMIN_KEY هەڵەیە یان Server بەردەست نییە.");

}

}

function render(orders){

const box=document.getElementById("orders");

if(!orders.length){

box.innerHTML=
'<div class="card">هیچ Order ـێک نییە.</div>';

return;

}

box.innerHTML=orders.map(o=>`

<div class="card order">

<div class="top">

<h2>${esc(o.id)}</h2>

<span class="status ${o.status==="esim_ready"?"ready":""}">
${esc(statusText(o.status))}
</span>

</div>

<p>
<b>🌍 وڵات:</b>
${esc(o.country)}
</p>

<p>
<b>📦 پلان:</b>
${esc(o.plan)}
</p>

<p>
<b>💰 نرخ:</b>
${esc(o.price)}
</p>

<p>
<b>💳 پارەدان:</b>
${esc(o.payment)}
</p>

${o.receiptUrl ? `

<p>
<b>🧾 پسوڵە:</b>

<a target="_blank"
href="${fileUrl(o.receiptUrl)}">
کردنەوەی پسوڵە
</a>

</p>

`:""}

<div class="row">

<button class="btn green"
onclick="setStatus('${o.id}','payment_confirmed')">
پارەدان پشتڕاستە
</button>

<label class="btn">

📱 Upload QR

<input
id="qr-${o.id}"
type="file"
accept="image/*"
style="display:none"
onchange="uploadQR('${o.id}')">

</label>

<button class="btn danger"
onclick="setStatus('${o.id}','cancelled')">
هەڵوەشاندنەوە
</button>

</div>

</div>

`).join("");

}

async function setStatus(id,status){

const r=await fetch(
`${API}/api/admin/orders/${encodeURIComponent(id)}/status`,
{
method:"POST",
headers:{
"Content-Type":"application/json",
...headers()
},
body:JSON.stringify({status})
});

if(!r.ok){

alert("نەتوانرا status بگۆڕدرێت");

return;

}

loadOrders();

}

async function uploadQR(id){

const f=document.getElementById(`qr-${id}`)?.files?.[0];

if(!f)return;

const fd=new FormData();

fd.append("qr",f);

const r=await fetch(
`${API}/api/admin/orders/${encodeURIComponent(id)}/qr`,
{
method:"POST",
headers:headers(),
body:fd
});

const d=await r.json();

if(!r.ok){

alert(d.error||"QR upload نەکرا");

return;

}

alert("QR نێردرا و Order ئامادە کرا.");

loadOrders();

}

function esc(s){

return String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}

if(key)loadOrders();

</script>

</body>
</html>
